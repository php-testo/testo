name: Mutation Tests

on:
  push:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'bin/**'
      - 'tools/phpunit/composer.json'
      - 'infection.json'
      - 'tools/phpunit/infection.phpunit.json'
      - 'tools/phpunit/phpunit.xml'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/infection.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'bin/**'
      - 'tools/phpunit/composer.json'
      - 'infection.json'
      - 'tools/phpunit/infection.phpunit.json'
      - 'tools/phpunit/phpunit.xml'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/infection.yml'

jobs:
  # Mutate the engine with PHPUnit as the runner. Testo is self-hosted, so a mutant on its own run
  # path could break test discovery and fake a pass; PHPUnit shares no code with the mutated engine,
  # so a mutant is only ever caught (or missed) by an assertion — which is why the native Testo-runner
  # front was dropped and this is the sole mutation front. The suite is the generated tests/PhpUnit
  # mirror (see bridge/rector/README.md "Why Testo -> PHPUnit").
  infection-phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.4 ]
        dependencies: [ highest ]

    name: Infection (PHPUnit mirror) PHP${{ matrix.php }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # PHPUnit, Infection, rector and the bridge runtime deps are isolated via bamarni-bin, not in
      # the root install.
      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      # Copy the Testo suite, convert it to PHPUnit (Rector) and relocate it to tests/PhpUnit.
      - name: Build the PHPUnit mirror
        run: composer phpunit:build

      - name: Run Infection on the PHPUnit mirror
        run: composer infect:phpunit:ci
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ github.event_name == 'push' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
