name: Mutation Tests

on:
  push:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'infection.json'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/infection.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'infection.json'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/infection.yml'

jobs:
  infection:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2 ]
        dependencies: [ highest ]

    name: Infection PHP${{ matrix.php }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # The split sub-packages pin testo/testo; in CI the root is a detached
      # commit (dev-<sha>), so its version must be declared explicitly.
      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run Infection
        run: composer infect:ci
