name: Tests

on:
  push:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/tests.yml'

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.1, 8.2, 8.3, 8.4, 8.5 ]
        dependencies: [ lowest , highest ]
        exclude:
          # 8.1 is exercised only against the lowest, 8.1-compatible dependency set:
          # the highest set pulls Symfony 8 (PHP 8.4+), which can't run on 8.1.
          - php: 8.1
            dependencies: highest
      max-parallel: 2

    name: Tests PHP${{ matrix.php }}-${{ matrix.dependencies }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      # The split sub-packages pin testo/testo; in CI the root is a detached
      # commit (dev-<sha>), so its version must be declared explicitly.
      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The llm/skills Composer plugin runs a post-install hook whose code uses
      # `readonly class`, so it fatals on 8.1 during install itself — before the
      # sources can be downgraded. It is dev-only tooling the suite never needs.
      - name: Drop the llm/skills plugin on 8.1
        if: matrix.php == '8.1'
        run: composer remove --dev llm/skills --no-update --no-interaction

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          # On 8.1 the sources still declare PHP >=8.2 (they use `readonly class`);
          # bypass the platform check here and downgrade the code before the tests run.
          composer-options: ${{ matrix.php == '8.1' && '--ignore-platform-req=php' || '' }}

      - name: Downgrade sources to PHP 8.1
        if: matrix.php == '8.1'
        uses: php-testo/actions/downgrade-php@v1
        with:
          paths: core plugin bridge tests testo.php
          php-version: '8.1'
          skip: bridge/symfony-console/resources/stubs

      # Bin tools carry deps with a higher PHP floor than the matrix (e.g. tools/double).
      # They install everywhere but only load where the platform allows, so ignore the check.
      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      - name: Run Tests
        run: composer test:ci

  code-coverage:
    runs-on: ubuntu-latest
    name: Code Coverage
    concurrency:
      group: code-coverage-${{ github.ref }}
      cancel-in-progress: true

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      - name: Run Tests with Coverage
        run: composer test:cc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: runtime/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
