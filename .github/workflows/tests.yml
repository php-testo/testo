name: Tests

on:
  push:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'plugin/**'
      - 'bridge/**'
      - 'tests/**'
      - 'testo.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/tests.yml'

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2, 8.3, 8.4, 8.5 ]
        dependencies: [ lowest , highest ]
        include:
          - php: 8.1
            dependencies: highest
      max-parallel: 2

    name: Tests PHP${{ matrix.php }}-${{ matrix.dependencies }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      # The split sub-packages pin testo/testo; in CI the root is a detached
      # commit (dev-<sha>), so its version must be declared explicitly.
      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        if: matrix.php != '8.1'
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Install and downgrade for PHP 8.1
        if: matrix.php == '8.1'
        uses: php-internal/actions/downgrade@v1
        with:
          php-version: '8.1'
          dependency-versions: ${{ matrix.dependencies }}
          paths: core plugin bridge tests testo.php

      # Bin tools carry deps with a higher PHP floor than the matrix (e.g. tools/double).
      # They install everywhere but only load where the platform allows, so ignore the check.
      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      - name: Run Tests
        run: composer test:ci

  ci-32bit:
    runs-on: ubuntu-latest
    name: Tests PHP8.4-32bit

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      # Dependencies are installed by a 64-bit PHP of the same version: the runner's actions do not
      # run inside an i386 container, and the vendor code is the same for both.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      # Rector itself packs 64-bit values, so its fixtures cannot run on 32-bit PHP.
      - name: Run Tests on 32-bit PHP
        run: >-
          docker run --rm --platform linux/386
          -v "$PWD":/app -w /app -e TESTO_CI=1
          php:8.4-cli
          sh -c 'php -r "echo PHP_INT_SIZE * 8, \" bit\n\"; exit(PHP_INT_SIZE === 4 ? 0 : 1);" && php vendor/bin/testo --type=!rector-fixture'

  code-coverage:
    runs-on: ubuntu-latest
    name: Code Coverage
    concurrency:
      group: code-coverage-${{ github.ref }}
      cancel-in-progress: true

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      - name: Run Tests with Coverage
        run: composer test:cc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: runtime/clover.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload clover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-xdebug
          path: runtime/clover.xml

  code-coverage-pcov:
    runs-on: ubuntu-latest
    name: Code Coverage (PCOV)
    concurrency:
      group: code-coverage-pcov-${{ github.ref }}
      cancel-in-progress: true

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: pcov

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      # PCOV takes a single root directory; vendor code is excluded to match the other drivers' whitelist.
      - name: Run Tests with Coverage
        env:
          TESTO_CI: 1
        run: >-
          time php -d pcov.directory="$GITHUB_WORKSPACE" -d pcov.exclude='~/vendor/~'
          vendor/bin/testo --coverage --coverage-clover=runtime/clover.xml --type=!bench

      - name: Upload clover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-pcov
          path: runtime/clover.xml

  code-coverage-turbocov:
    runs-on: ubuntu-latest
    name: Code Coverage (turbocov)
    concurrency:
      group: code-coverage-turbocov-${{ github.ref }}
      cancel-in-progress: true

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: pie
          ini-values: opcache.enable_cli=0

      - name: Resolve turbocov build key
        id: turbocov
        run: |
          echo "version=$(curl -fsSL https://repo.packagist.org/p2/shipmonk/turbocov.json | jq -r '.packages["shipmonk/turbocov"][0].version')" >> "$GITHUB_OUTPUT"
          echo "php=$(php -r 'echo PHP_VERSION;')" >> "$GITHUB_OUTPUT"

      - name: Cache turbocov build
        id: turbocov-cache
        uses: actions/cache@v4
        with:
          path: ~/.turbocov
          key: turbocov-${{ runner.os }}-php${{ steps.turbocov.outputs.php }}-${{ steps.turbocov.outputs.version }}-impersonate-pcov

      # The impersonation mode registers turbocov as `pcov`, so Testo picks its PCOV driver unchanged.
      - name: Build turbocov
        if: steps.turbocov-cache.outputs.cache-hit != 'true'
        run: |
          sudo pie install "shipmonk/turbocov:${{ steps.turbocov.outputs.version }}" --enable-turbocov-impersonate-pcov
          mkdir -p ~/.turbocov
          cp "$(php-config --extension-dir)/turbocov.so" ~/.turbocov/

      # PIE cannot detect the extension under the `pcov` name and leaves it disabled.
      - name: Enable turbocov
        run: |
          echo "extension=$HOME/.turbocov/turbocov.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-turbocov.ini"
          php --ri pcov

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Install bin tools
        run: composer bin all install --ignore-platform-req=php

      # turbocov needs an explicit whitelist; finer excludes are applied by the driver.
      - name: Run Tests with Coverage
        env:
          TESTO_CI: 1
        run: >-
          time php -d pcov.directory="$GITHUB_WORKSPACE/core:$GITHUB_WORKSPACE/plugin:$GITHUB_WORKSPACE/bridge"
          vendor/bin/testo --coverage --coverage-clover=runtime/clover.xml --type=!bench

      - name: Upload clover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-turbocov
          path: runtime/clover.xml
